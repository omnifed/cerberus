name: 🧾 Code Checks

# workflow_dispatch lets bot workflows start these checks on PRs they open
# with GITHUB_TOKEN (which never triggers pull_request runs).
on: [merge_group, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CI: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Unit tests pass
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '22'

      - run: pnpm install
      - run: pnpm run test:ci
        working-directory: ./tests

  generated-docs:
    runs-on: ubuntu-latest
    name: Generated component APIs and docs are up to date
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '22'

      - run: pnpm install
      # The docs Panda spec (recipe variants) reads the built react + data-grid
      # design systems, as in the docs `dev` script.
      - run: pnpm run build
        working-directory: ./packages/react
      - run: pnpm run build
        working-directory: ./packages/data-grid
      - run: pnpm exec panda codegen --spec
        working-directory: ./docs
      # Includes the integration tests against the Panda spec above, which fail
      # (rather than skip) here if the spec is missing
      - run: pnpm run test:codegen
        working-directory: ./tests
        env:
          CODEGEN_REQUIRE_SPEC: '1'
      - run: pnpm run generate:check
        working-directory: ./tools/codegen

  react-build:
    runs-on: ubuntu-latest
    name: React successfully builds
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '22'

      - run: pnpm install
      - run: pnpm run build
        working-directory: ./packages/react

  data-grid:
    runs-on: ubuntu-latest
    name: Data Grid successfully builds
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '22'

      - run: pnpm install
      - run: pnpm run build
        working-directory: ./packages/react
      - run: pnpm run build
        working-directory: ./packages/data-grid

  signals:
    runs-on: ubuntu-latest
    name: Signals successfully builds
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: '22'

      - run: pnpm install
      - run: pnpm run build
        working-directory: ./packages/signals
