nodeVersion: 24.16.0
engineStrict: true

packages:
  - packages/*
  - tests
  - bench
  - scripts
  - docs
  - styled-system

catalogs:
  oxc:
    oxfmt: ^0.68.0
  ark:
    '@ark-ui/react': ^5.39.2
  pandacss:
    '@pandacss/dev': ^1.12.1
    '@pandacss/preset-panda': ^1.12.1
    '@pandacss/types': ^1.12.1
  jsx:
    '@carbon/icons-react': ^11.88.0
    globby: ^16.2.4
    react: ^19.3.0
    react-dom: ^19.3.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    vite: ^8.3.0
    vite-plugin-dts: ^5.1.1
    '@vitejs/plugin-react': ^6.1.1
    '@typescript/typescript6': ^6.0.0 # required for vite-dts
  ts:
    typescript: ^7.0.2
  types:
    '@types/bun': ^1.4.2
    '@types/node': ^26.6.2

allowBuilds:
  '@carbon/icon-helpers': true
  '@carbon/icons-react': true
  '@tsparticles/engine': true
  bun: true
  esbuild: true
  sharp: true
  unrs-resolver: true

auditConfig:
  # Only non-package related allowed here
  ignoreGhsas:
    - GHSA-h67p-54hq-rp68 # changeset
    - GHSA-qx2v-qp2m-jg93 # postcss (docs)

overrides:
  # pandacss
  brace-expansion: '>=5.0.9'
  browserslist: '>=4.28.7'
  fast-uri: '>=4.1.3'
  postcss-selector-parser: '>=7.1.3'
  # docs
  eslint>ajv: '^6.12.6'
  '@eslint/eslintrc>js-yaml': '>=4.3.2'
  '@eslint/eslintrc>ajv': '^6.12.6'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.18'
  sharp: '>=0.35.4'
  toml: '^4.1.2'
